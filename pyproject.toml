[project]
name = "nakagai"
version = "0.4.2"
description = "Deterministic core for rule-driven trading agents: bar cache, walk-forward engine, RuleSpec strategy DSL, screener"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
keywords = ["trading", "backtesting", "walk-forward", "screener", "quant"]
# No `License ::` classifier: `license` above is a PEP 639 SPDX expression, and
# modern build backends reject carrying both. Only 3.12 is claimed because only
# 3.12 is what CI runs.
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=16",
    "httpx>=0.27",
]

[project.optional-dependencies]
nlbuilder = ["anthropic>=0.116"]

[project.urls]
Homepage = "https://nakag.ai"
Repository = "https://github.com/loubylabs/nakagai"
Issues = "https://github.com/loubylabs/nakagai/issues"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nakagai"]

[tool.hatch.build.targets.sdist]
# What ships is a choice, not whatever happened to be tracked. `tests/` and the
# lockfile earn their place (someone building from source can verify it); CI
# config does not.
exclude = [".github"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Several tests share fixtures through `from tests.<module> import ...`
# (`whole_frame_oracle`, `pine_interpreter`, and two test modules imported for
# their golden sets), so the repo root has to be importable. Say so here rather
# than inheriting it: an editable install drops the root onto sys.path as a
# side effect, which is why this suite passes in this repo's own CI and fails
# the moment it is run against a BUILT nakagai wheel. That is not hypothetical.
# It is exactly what chrvsd/nakagai's "core integration at the pinned rev" job
# does, and modules that relied on the side effect failed to collect there the
# first time a platform pin included them.
pythonpath = ["."]
